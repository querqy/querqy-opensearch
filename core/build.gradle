apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'idea'
apply plugin: 'opensearch.opensearchplugin'
apply plugin: 'maven-publish'
apply plugin: 'signing'

base {
    archivesName = 'querqy-opensearch-core'
}

// The opensearchplugin{} block below intentionally sets the same plugin `name` as the root project (so the two
// can't be installed side by side, per design) - but the opensearch.opensearchplugin convention plugin ties the
// `jar` task's archive name to that same `name`, which would make :core's jar collide (same filename) with root's
// own jar when root's bundlePlugin copies both into one zip. Force the jar's own archive name back after the
// convention plugin's own afterEvaluate has run, so the two are never filename-identical.
afterEvaluate {
    tasks.named('jar') {
        archiveBaseName.set('querqy-opensearch-core')
    }
}

opensearchplugin {
    name = 'opensearch-querqy'
    description = 'Query rewriting plugin (core: no ActionPlugin, installable where it is unsupported, e.g. Amazon OpenSearch Service)'
    classname = 'querqy.opensearch.QuerqyCorePlugin'
    licenseFile = rootProject.file('LICENSE.txt')
    noticeFile = rootProject.file('NOTICE.txt')
}

dependencies {
    api('org.querqy:querqy-lucene:5.12.lucene1040.0')
    api('org.querqy:querqy-core:4.2.0')
    api('com.fasterxml.jackson.core:jackson-databind:2.22.3')
    api('com.fasterxml.jackson.core:jackson-annotations:2.22')
    implementation('com.jayway.jsonpath:json-path:3.0.0')
    runtimeOnly('org.slf4j:slf4j-api:2.0.17')
    implementation('org.ow2.asm:asm:9.10.1')
    testImplementation('junit:junit:4.13.2')
    testImplementation('org.mockito:mockito-core:5.23.0')
    testImplementation('org.assertj:assertj-core:3.27.7')
    testImplementation "org.opensearch:opensearch-agent-bootstrap:${rootProject.ext.opensearch_version}"
}

test {
    useJUnit()
    finalizedBy jacocoTestReport
    include "**/*Test.class"
    systemProperty 'tests.security.manager', 'false'
}

configurations.all {
    resolutionStrategy.force 'junit:junit:4.13.2'
    resolutionStrategy.force 'org.mockito:mockito-core:5.23.0'
}

// Applying opensearch.opensearchplugin a second time in this build re-creates these convention tasks scoped to
// :core; disable them here exactly as the root project already does, so ./gradlew build doesn't fail on checks that
// only make sense for a release of the full plugin.
licenseHeaders.enabled = true
validateNebulaPom.enabled = false
generatePomFileForNebulaPublication.enabled = false
generateMetadataFileForNebulaPublication.enabled = false
publishNebulaPublicationToMavenLocal.enabled = false
tasks.whenTaskAdded { task ->
    if (task.name.contains("publishNebulaPublicationToSonatypeRepository")) {
        task.enabled = false
    }
}
dependencyLicenses.enabled = false
thirdPartyAudit.enabled = false
forbiddenApis.ignoreFailures = true
testingConventions.enabled = false
loggerUsageCheck.enabled = false

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(tasks.named("bundlePlugin")) {
                builtBy(tasks.named("bundlePlugin"))
            }

            groupId = 'org.querqy'
            artifactId = 'querqy-opensearch-core'
            version = "$version"

            from components.java

            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }

            pom {
                name = 'Querqy Opensearch Core'
                description = 'Core module of the Querqy OpenSearch plugin - the querqy query, the rewriters, and ' +
                        'index-based rewriter config management, but no ActionPlugin REST/transport API. ' +
                        'Installable where ActionPlugin is unsupported, e.g. Amazon OpenSearch Service.'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'jope'
                        name = 'Johannes Peter'
                        email = 'johannesdaniel.peter@gmx.de'
                        url = 'https://github.com/querqy/querqy-opensearch'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'sonatype'
            url = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            credentials(PasswordCredentials)
        }
    }
}

signing {
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}

tasks.named("signMavenJavaPublication") {
    dependsOn(tasks.named("bundlePlugin"))
}

// opensearch.opensearchplugin (via its bundled org.opensearch.gradle.PublishPlugin, applied unconditionally as
// part of opensearch.opensearchplugin - there is no way to opt out) always creates its own extra "nebula"
// MavenPublication here too (coordinates org.opensearch:opensearch-querqy, derived from this project's raw Gradle
// group and opensearchplugin{}'s `name`) alongside our own "mavenJava" one below - its own publish tasks are
// already disabled above, but the publication object itself still exists. That makes root's own generated POM
// fail entirely when resolving its dependency on :core ("Publishing is not able to resolve a dependency on a
// project with multiple publications that have different coordinates") - Gradle's cross-project publication
// resolver indexes publications as they're added and does not un-index one that's later removed from the
// container, so removing "nebula" here does not fix that resolver's view (confirmed empirically) - but mutating
// an existing publication's own properties does get picked up correctly. So instead of removing "nebula", force
// its coordinates to be identical to "mavenJava"'s: Gradle only objects to DIFFERENT coordinates, not to two
// publications sharing the same one.
//
// This must happen only once every project in the whole build has fully finished configuring itself (including
// its own afterEvaluate callbacks) - root's own cross-project dependency resolution (used to generate its POM's
// <dependency> entry on :core) reads :core's publications before this project's own afterEvaluate chain
// completes, so a plain `afterEvaluate` here is too early; `gradle.projectsEvaluated` is not.
gradle.projectsEvaluated {
    publishing.publications.mavenJava.artifactId = 'querqy-opensearch-core'
    publishing.publications.nebula.groupId = 'org.querqy'
    publishing.publications.nebula.artifactId = 'querqy-opensearch-core'
}
