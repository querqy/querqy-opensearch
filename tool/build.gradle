apply plugin: 'java'
apply plugin: 'application'

base {
    archivesName = 'querqy-opensearch-tool'
}

application {
    mainClass = 'querqy.opensearch.tool.RewriterConfigTool'
}

// :tool is a plain CLI, not an OpenSearch plugin, so it doesn't apply opensearch.opensearchplugin and therefore
// doesn't inherit that convention plugin's repository wiring - declare it explicitly.
repositories {
    mavenLocal()
    maven { url = "https://aws.oss.sonatype.org/content/repositories/snapshots" }
    mavenCentral()
}

dependencies {
    implementation project(':core')
    // :core's own dependency on the OpenSearch server jar isn't `api`, so it doesn't propagate transitively here -
    // :tool needs it directly to compile against OpenSearchRewriterFactory/RewriterConfigMapping's API surface.
    implementation "org.opensearch:opensearch:${rootProject.ext.opensearch_version}"
    implementation "org.opensearch.client:opensearch-rest-client:${rootProject.ext.opensearch_version}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    testImplementation('junit:junit:4.13.2')
    testImplementation('org.mockito:mockito-core:5.23.0')
    testImplementation('org.assertj:assertj-core:3.27.7')
}

test {
    useJUnit()
}
